name: Static checks

on:
  push:
  pull_request:

jobs:
  python-and-bringup-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall tools tests

      - name: Validate main.c bring-up structure
        run: python tools/validate_main_c.py 3ds/source/main.c

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
