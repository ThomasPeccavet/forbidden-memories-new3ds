name: devkitARM compile check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile-native-3ds:
    runs-on: ubuntu-latest
    container:
      # Pin the official devkitPro image so compiler changes are deliberate.
      image: devkitpro/devkitarm:20260610
      options: --user 1001

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Checkout pinned PSXRecomp runtime
        uses: actions/checkout@v5
        with:
          repository: Unchiga/psxrecomp
          ref: 1965b2df424da03483a5370340433a862f78f103
          path: work/upstream-psxrecomp

      - name: Show toolchain versions
        run: |
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version | head -1
          3dsxtool --version || true

      - name: Compile all native ARM11 units
        run: >-
          make -C 3ds compile-check -j2
          EXTRA_CFLAGS="-Werror=implicit-function-declaration
          -Werror=incompatible-pointer-types
          -Werror=int-conversion
          -Werror=return-type
          -Werror=format"

      - name: List compiled objects
        run: find 3ds/build -maxdepth 1 -name '*.o' -type f -print | sort

      - name: Report object sizes and unresolved ABI imports
        run: |
          "$DEVKITARM/bin/arm-none-eabi-size" -t 3ds/build/*.o

          defined=/tmp/fm-native-defined.txt
          undefined=/tmp/fm-native-undefined.txt

          "$DEVKITARM/bin/arm-none-eabi-nm" \
            -g --defined-only 3ds/build/*.o \
            | awk 'NF >= 3 {print $NF}' \
            | sort -u > "$defined"

          "$DEVKITARM/bin/arm-none-eabi-nm" -u 3ds/build/*.o \
            | sed '/:$/d' \
            | awk '{print $NF}' \
            | sort -u > "$undefined"

          echo "External ABI imports after native cross-object resolution:"
          comm -23 "$undefined" "$defined"
